name: Dockerize and push FakeErp

on:
  push:
    branches: 
      - "master"
    paths:
      - "FakeERP/src/**"  
  pull_request:
    branches: 
      - "master"
    paths:
      - "FakeERP/src/**"  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Check out the repository
    - uses: actions/checkout@v4
    
    # Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

   # Build the Docker image
    - name: Build the Docker image
      working-directory: FakeERP/src/IntegrationSimulator.FakeERP
      run: |
        docker build . \
        --tag josephrashidmaalouf/fake-erp:${{ github.run_id }} \
        --tag josephrashidmaalouf/fake-erp:latest


    # Push both the latest and run-id tagged images
    - name: Push Docker images
      run: |
        docker push josephrashidmaalouf/fake-erp:latest
        docker push josephrashidmaalouf/fake-erp:${{ github.run_id }}
